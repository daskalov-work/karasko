<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Честит рожден ден, Караско!</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Russo+One&family=Manrope:wght@600;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="fx" id="fx" aria-hidden="true"><div class="flare"></div></div>

<div class="bug" aria-hidden="true">КАРАСКО ТВ <span class="live">НА ЖИВО</span></div>

<header>
  <p class="script">Честит рожден ден</p>
  <h1 class="name">КАРАСКО!</h1>
  <p class="sub">★ Върти колелото — пускай до дупка ★</p>
</header>

<div class="stage">
  <div class="rays" aria-hidden="true"></div>
  <svg class="pointer" viewBox="0 0 44 54" aria-hidden="true">
    <defs>
      <linearGradient id="pg" x1="0" x2="1">
        <stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffd23f"/>
        <stop offset=".55" stop-color="#b8860b"/><stop offset="1" stop-color="#ffe066"/>
      </linearGradient>
      <radialGradient id="gem" cx=".4" cy=".35" r=".7">
        <stop offset="0" stop-color="#ff9aa6"/><stop offset=".5" stop-color="#d4001f"/><stop offset="1" stop-color="#5a000d"/>
      </radialGradient>
    </defs>
    <path d="M4 4 H40 L22 52 Z" fill="url(#pg)" stroke="#3a2000" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="22" cy="17" r="7" fill="url(#gem)" stroke="#3a2000" stroke-width="1.5"/>
  </svg>
  <div class="rim">
    <svg class="wheel" id="wheel" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
    <div class="gloss"></div>
  </div>
  <button class="spin" id="spin" type="button">ВЪРТИ!</button>
</div>

<section class="result" id="result" hidden aria-live="polite">
  <p class="label">Падна се...</p>
  <div class="tv">
    <svg class="dancer l" viewBox="0 0 120 240" aria-hidden="true">
      <defs>
        <linearGradient id="skinl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fb4"/><stop offset="1" stop-color="#8a1ad1"/></linearGradient>
        <linearGradient id="gldl" x1="0" x2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
      </defs>
      <rect x="15" y="0" width="6" height="234" rx="3" fill="url(#gldl)"/>
      <ellipse cx="18" cy="234" rx="14" ry="3.5" fill="url(#gldl)"/>
      <g class="body" fill="url(#skinl)">
        <path d="M46 120 Q44 145 49 170 Q48 195 52 222 L48 231 L57 231 L57 222 Q60 195 58 170 Q62 146 62 128 Z"/>
        <path d="M62 128 Q63 146 68 168 Q72 192 72 222 L69 231 L78 231 L77 222 Q79 192 76 168 Q80 145 79 120 Z"/>
        <path d="M47 231 l11 0 l-1 -3 l-9 0 Z M68 231 l11 0 l-1 -3 l-9 0 Z" fill="url(#gldl)"/>
        <g class="upper">
          <path class="hair" d="M53 42 Q50 29 62 30 Q75 29 72 44 Q74 62 83 78 Q70 74 67 60 Z"/>
          <path d="M49 66 L33 74 L20 64" fill="none" stroke="url(#skinl)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M50 64 Q62 60 74 64 L76 70 Q78 82 72 92 Q70 100 71 104 Q80 113 79 122 L62 130 L45 122 Q44 113 53 104 Q54 100 52 92 Q46 82 48 70 Z"/>
          <rect x="59" y="52" width="6" height="11" rx="2"/>
          <ellipse cx="62" cy="44" rx="9" ry="11"/>
          <path d="M50 76 Q62 85 74 76 L73 83 Q62 89 51 83 Z" fill="url(#gldl)"/>
          <path d="M46 117 L78 117 L72 125 Q62 131 52 125 Z" fill="url(#gldl)"/>
          <g class="armup"><path d="M75 66 L86 46 L79 24" fill="none" stroke="url(#skinl)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
        </g>
      </g>
    </svg>
    <div class="player"><div id="yt"></div></div>
    <svg class="dancer r" viewBox="0 0 120 240" aria-hidden="true">
      <defs>
        <linearGradient id="skinr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fb4"/><stop offset="1" stop-color="#8a1ad1"/></linearGradient>
        <linearGradient id="gldr" x1="0" x2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
      </defs>
      <rect x="15" y="0" width="6" height="234" rx="3" fill="url(#gldr)"/>
      <ellipse cx="18" cy="234" rx="14" ry="3.5" fill="url(#gldr)"/>
      <g class="body" fill="url(#skinr)">
        <path d="M46 120 Q44 145 49 170 Q48 195 52 222 L48 231 L57 231 L57 222 Q60 195 58 170 Q62 146 62 128 Z"/>
        <path d="M62 128 Q63 146 68 168 Q72 192 72 222 L69 231 L78 231 L77 222 Q79 192 76 168 Q80 145 79 120 Z"/>
        <path d="M47 231 l11 0 l-1 -3 l-9 0 Z M68 231 l11 0 l-1 -3 l-9 0 Z" fill="url(#gldr)"/>
        <g class="upper">
          <path class="hair" d="M53 42 Q50 29 62 30 Q75 29 72 44 Q74 62 83 78 Q70 74 67 60 Z"/>
          <path d="M49 66 L33 74 L20 64" fill="none" stroke="url(#skinr)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M50 64 Q62 60 74 64 L76 70 Q78 82 72 92 Q70 100 71 104 Q80 113 79 122 L62 130 L45 122 Q44 113 53 104 Q54 100 52 92 Q46 82 48 70 Z"/>
          <rect x="59" y="52" width="6" height="11" rx="2"/>
          <ellipse cx="62" cy="44" rx="9" ry="11"/>
          <path d="M50 76 Q62 85 74 76 L73 83 Q62 89 51 83 Z" fill="url(#gldr)"/>
          <path d="M46 117 L78 117 L72 125 Q62 131 52 125 Z" fill="url(#gldr)"/>
          <g class="armup"><path d="M75 66 L86 46 L79 24" fill="none" stroke="url(#skinr)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
        </g>
      </g>
    </svg>
  </div>
  <div class="lower">
    <span class="artist"><span id="artist"></span></span>
    <span class="song"><span id="song"></span></span>
  </div>
  <p class="again"><a id="ytlink" target="_blank" rel="noopener">▶ Гледай в YouTube ↗</a><br>Пак? Цъкни „ВЪРТИ!“</p>
</section>

<div class="ticker" aria-hidden="true">
  <div class="tag">SMS ЧАТ</div>
  <div class="track"><div class="run" id="run"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script src="js/songs.js"></script>
<script src="js/player.js"></script>
<script src="js/wheel.js"></script>
</body>
</html>
